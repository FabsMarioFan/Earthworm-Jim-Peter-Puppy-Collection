name: Build Earthworm Jim Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Download SDL2 source
        run: |
          mkdir -p third_party

          curl -fL \
            https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.zip \
            -o /tmp/SDL2.zip

          echo "12b2dc2eb8f2836100a7916b5d394a0c82f1f7e32693f95f98305403af242f08  /tmp/SDL2.zip" | sha256sum -c -

          unzip -q /tmp/SDL2.zip -d /tmp/sdl2

          mv /tmp/sdl2/SDL2-2.32.10 third_party/SDL2-2.32.10-src

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Earthworm-Jim-Peter-Puppy-Collection
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
