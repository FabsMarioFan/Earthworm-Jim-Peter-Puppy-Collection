name: Build Android APK

# Compila el APK (debug) y lo sube como artefacto descargable.
# Guárdalo en el repo como: .github/workflows/android.yml
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Download SDL2 source
        run: |
          mkdir -p third_party
          curl -L -o sdl2.zip https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.zip
          echo "12b2dc2eb8f2836100a7916b5d394a0c82f1f7e32693f95f98305403af242f08  sdl2.zip" | sha256sum -c -
          unzip -q sdl2.zip -d third_party
          mv third_party/SDL2-2.32.10 third_party/SDL2-2.32.10-src
          rm sdl2.zip

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Earthworm-Jim-Collection-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
